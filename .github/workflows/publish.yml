name: Publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-14
            rust_target: ""
            tauri_target: aarch64-apple-darwin
            desktop_bundles: dmg
          - platform: darwin-x64
            runner: macos-15-intel
            rust_target: ""
            tauri_target: x86_64-apple-darwin
            desktop_bundles: dmg
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-musl
            tauri_target: aarch64-unknown-linux-gnu
            desktop_bundles: deb
          - platform: linux-x64
            runner: ubuntu-24.04
            rust_target: x86_64-unknown-linux-musl
            tauri_target: x86_64-unknown-linux-gnu
            desktop_bundles: deb
          - platform: win32-x64
            runner: windows-2025
            rust_target: ""
            tauri_target: x86_64-pc-windows-msvc
            desktop_bundles: nsis
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: ${{ matrix.rust_target }}

      - name: Install musl linker
        if: startsWith(matrix.platform, 'linux-')
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install Tauri Linux dependencies
        if: startsWith(matrix.platform, 'linux-')
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            wget

      - run: npm ci --ignore-scripts --omit=optional
      - run: npm ci --prefix desktop --ignore-scripts
      - run: node scripts/check-release-version.mjs
      - run: cargo test --locked
        timeout-minutes: 3
      - run: cargo clippy --all-targets --locked -- -D warnings

      - name: Build native executable
        shell: bash
        run: |
          if [[ -n "${{ matrix.rust_target }}" ]]; then
            cargo build --release --locked --target "${{ matrix.rust_target }}"
          else
            cargo build --release --locked
          fi

      - name: Package native executable
        shell: bash
        env:
          ASVC_BUILD_TARGET: ${{ matrix.rust_target }}
        run: node scripts/package-platform.mjs

      - name: Smoke-test npm launcher and installed package
        run: npm run test:native
        timeout-minutes: 3

      - name: Prepare headless CLI for the desktop sidecar
        shell: bash
        env:
          ASVC_BUILD_TARGET: ${{ matrix.rust_target }}
          ASVC_TAURI_TARGET: ${{ matrix.tauri_target }}
        run: npm run desktop:prepare

      - name: Build desktop installer
        shell: bash
        run: npm run desktop:build:only -- --target "${{ matrix.tauri_target }}" --bundles "${{ matrix.desktop_bundles }}" --config src-tauri/tauri.release.conf.json

      - name: Verify macOS app signature envelope
        if: startsWith(matrix.platform, 'darwin-')
        shell: bash
        run: |
          dmg=$(find "src-tauri/target/${{ matrix.tauri_target }}/release/bundle/dmg" -maxdepth 1 -name '*.dmg' -print -quit)
          test -n "$dmg"
          mount_output=$(hdiutil attach -nobrowse -readonly -noverify "$dmg")
          mount_point=$(printf '%s\n' "$mount_output" | awk '/\/Volumes\// {print substr($0, index($0, "/Volumes/")); exit}')
          test -n "$mount_point"
          trap 'hdiutil detach "$mount_point" -quiet || true' EXIT
          codesign --verify --deep --strict --verbose=2 "$mount_point/Asvc.app"

      - name: Package desktop artifacts and checksums
        shell: bash
        env:
          ASVC_DESKTOP_PLATFORM: ${{ matrix.platform }}
          ASVC_TAURI_TARGET: ${{ matrix.tauri_target }}
        run: npm run desktop:package

      - name: Pack native npm package
        shell: bash
        run: npm pack "./npm/asvc-${{ matrix.platform }}" --pack-destination release

      - uses: actions/upload-artifact@v6
        with:
          name: build-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            npm/asvc-${{ matrix.platform }}/
            release/asvc-v*-${{ matrix.platform }}.*
            release/asvc-desktop-v*-${{ matrix.platform }}-*
            release/homeant-asvc-${{ matrix.platform }}-*.tgz
            release/SHA256SUMS-${{ matrix.platform }}
            release/SHA256SUMS-desktop-${{ matrix.platform }}

  publish:
    name: Publish npm packages and GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci --ignore-scripts --omit=optional

      - uses: actions/download-artifact@v8
        with:
          pattern: build-*
          merge-multiple: true

      - name: Validate assembled release
        env:
          ASVC_REQUIRE_ALL_BINARIES: "1"
        run: |
          chmod 755 npm/asvc-darwin-arm64/bin/asvc npm/asvc-darwin-x64/bin/asvc
          chmod 755 npm/asvc-linux-arm64/bin/asvc npm/asvc-linux-x64/bin/asvc
          node scripts/check-release-version.mjs
          node scripts/verify-npm-packages.mjs
          cat release/SHA256SUMS-* | sort > release/SHA256SUMS

      - name: Generate signed desktop updater manifest
        env:
          ASVC_RELEASE_DATE: ${{ github.event.head_commit.timestamp }}
        run: node scripts/generate-updater-manifest.mjs

      - name: Publish native npm packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for package in release/homeant-asvc-*.tgz; do
            name=$(tar -xOf "$package" package/package.json | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).name")
            if npm view "$name@${GITHUB_REF_NAME#v}" version >/dev/null 2>&1; then
              echo "$name@${GITHUB_REF_NAME#v} already exists; skipping"
            else
              # Prefix the relative tarball path so npm does not parse
              # release/... as a GitHub shorthand package spec.
              npm publish "./$package" --provenance
            fi
          done

      - name: Publish npm launcher package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if npm view "@homeant/asvc@${GITHUB_REF_NAME#v}" version >/dev/null 2>&1; then
            echo "@homeant/asvc@${GITHUB_REF_NAME#v} already exists; skipping"
          else
            npm publish --provenance
          fi

      - name: Create GitHub Release with GitHub CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(release/asvc-v*.tar.gz release/asvc-v*.zip release/asvc-desktop-v* release/SHA256SUMS release/latest.json)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --verify-tag \
              --generate-notes \
              --title "asvc $GITHUB_REF_NAME"
          fi

  update-homebrew:
    name: Update Homebrew tap
    needs: publish
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Check out Homebrew tap
        uses: actions/checkout@v6
        with:
          repository: homeant/homebrew-tap
          path: homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}

      - name: Render formula from this release
        env:
          ASVC_TAG: ${{ github.ref_name }}
        run: ./scripts/update-homebrew-formula.sh homebrew-tap

      - name: Validate and publish formula
        working-directory: homebrew-tap
        run: |
          ruby -c Formula/asvc.rb
          if git diff --quiet -- Formula/asvc.rb; then
            echo "Formula is already current"
            exit 0
          fi

          version=${GITHUB_REF_NAME#v}
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/asvc.rb
          git commit -m "asvc ${version}"
          git push
